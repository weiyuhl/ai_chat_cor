[package]
name = "ai_chat_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "ai_chat_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
anyhow = "1.0"
thiserror = "1.0"
jni = "0.21"
lazy_static = "1.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
